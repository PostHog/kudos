packages:
  - website
  - service
# A newly published version waits a week before an install may pick it.
minimumReleaseAge: 10080
allowBuilds:
  # Restores the symlinks of the Postgres binaries the service's tests start.
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/linux-arm64": true
  "@embedded-postgres/linux-x64": true
  core-js: false
  esbuild: false
patchedDependencies:
  convex-test@0.0.61: patches/convex-test@0.0.61.patch
