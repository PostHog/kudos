# Promotes a commit of main from the sandbox to production. The sandbox app deploys every push to main and the
# production app deploys the `production` branch; this workflow moves `production` forward to a commit only once that
# commit passed its checks, the sandbox serves exactly it, and the journeys tagged @sandbox passed against the sandbox.
#
# Off until the repository variable HEDGEHUG_PROMOTION turns it on: `sandbox` runs the gate and never touches
# production, as at the sandbox rehearsal; `production` also fast-forwards production, from the cutover on. Unset or
# anything else, every job is skipped.
name: Promote to production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One promotion at a time, and every waiting run keeps its turn, so a rerun of an older commit never pushes a newer
# commit's run out of the queue. A run on another ref skips every job, so it queues apart.
concurrency:
  group: promote-production-${{ github.ref }}
  cancel-in-progress: false
  queue: max

# The checks a commit passes before it is promoted: CI's on main, and the sandbox's deploy. This workflow's own jobs
# carry names of their own, so none of them is ever read as one of these.
env:
  REQUIRED_CHECKS: |
    gate
    e2e-rewrite
    hosthog/deploy (hedgehug-sandbox)

jobs:
  # Waits for the commit's checks, the sandbox's deploy among them, then for the sandbox to serve exactly this commit.
  sandbox:
    name: "promotion: wait for the sandbox"
    if: ${{ github.ref == 'refs/heads/main' && (vars.HEDGEHUG_PROMOTION == 'sandbox' || vars.HEDGEHUG_PROMOTION == 'production') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      checks: read
      statuses: read
    outputs:
      outcome: ${{ steps.serves.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Wait for the commit's checks and the sandbox's deploy
        run: node tools/release/promote.ts checks
        env:
          SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          DEADLINE_MS: "3600000"

      - name: Wait for the sandbox to serve exactly this commit
        id: serves
        run: node tools/release/promote.ts serves
        env:
          SHA: ${{ github.sha }}
          APP_URL: ${{ vars.HEDGEHUG_SANDBOX_URL }}
          DEADLINE_MS: "1200000"

  # The journeys tagged @sandbox against the sandbox: no Slack fake, no clock to move, no sign-in.
  gate:
    name: "promotion: journeys on the sandbox"
    needs: sandbox
    if: ${{ needs.sandbox.outputs.outcome == 'ready' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      outcome: ${{ steps.still.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec e2e-web install chromium --with-deps

      - name: Run the journeys tagged @sandbox against the sandbox
        run: |
          target="$RUNNER_TEMP/sandbox.env"
          printf '%s\n' KUDOS_TARGET_KIND=rewrite "KUDOS_APP_URL=$APP_URL" "KUDOS_SLACK_SIGNING_SECRET=$SIGNING_SECRET" "KUDOS_SLACK_WORKSPACE=$WORKSPACE" "KUDOS_SLACK_APP_ID=$APP_ID" KUDOS_SIGN_IN=edge-header KUDOS_HOSTED=true "KUDOS_EDGE_SIGN_IN_URL=$SIGN_IN_URL" > "$target"
          E2E_TARGET="$target" pnpm exec e2e run --config e2e/e2e.config.ts --tag @sandbox
        env:
          APP_URL: ${{ vars.HEDGEHUG_SANDBOX_URL }}
          SIGN_IN_URL: ${{ vars.HEDGEHUG_SANDBOX_SIGN_IN_URL }}
          WORKSPACE: ${{ vars.HEDGEHUG_SANDBOX_WORKSPACE }}
          APP_ID: ${{ vars.HEDGEHUG_SANDBOX_APP_ID }}
          SIGNING_SECRET: ${{ secrets.HEDGEHUG_SANDBOX_SIGNING_SECRET }}

      # What passed must be what is promoted: a sandbox that moved off this commit during the gate stops the promotion.
      - name: Check the sandbox still serves this commit
        id: still
        run: node tools/release/promote.ts serves
        env:
          SHA: ${{ github.sha }}
          APP_URL: ${{ vars.HEDGEHUG_SANDBOX_URL }}
          DEADLINE_MS: "0"

  # Moves production forward to exactly this commit, never back or sideways, and never creates the branch. It reads
  # the checks and the sandbox again just before, so a rerun of this job alone, maybe days on, still pushes only a
  # commit whose checks pass and which the sandbox still serves.
  promote:
    name: "promotion: move production"
    needs: gate
    if: ${{ needs.gate.outputs.outcome == 'ready' && vars.HEDGEHUG_PROMOTION == 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      checks: read
      statuses: read
    outputs:
      production: ${{ steps.forward.outputs.production }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Read the commit's checks again
        run: node tools/release/promote.ts checks
        env:
          SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          DEADLINE_MS: "0"

      - name: Check the sandbox still serves this commit
        id: still
        run: node tools/release/promote.ts serves
        env:
          SHA: ${{ github.sha }}
          APP_URL: ${{ vars.HEDGEHUG_SANDBOX_URL }}
          DEADLINE_MS: "0"

      - name: Fast-forward production to this commit
        id: forward
        if: ${{ steps.still.outputs.outcome == 'ready' }}
        run: node tools/release/promote.ts fast-forward
        env:
          SHA: ${{ github.sha }}
          HEDGEHUG_PROMOTION: ${{ vars.HEDGEHUG_PROMOTION }}

  # Once production serves the commit, the journeys tagged @sandbox that write nothing run against it, also when an
  # earlier attempt already moved production and this one found it current.
  production:
    name: "promotion: journeys on production"
    needs: promote
    if: ${{ needs.promote.outputs.production == 'moved' || needs.promote.outputs.production == 'current' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Wait for production to serve exactly this commit
        id: serves
        run: node tools/release/promote.ts serves
        env:
          SHA: ${{ github.sha }}
          APP_URL: ${{ vars.HEDGEHUG_PRODUCTION_URL }}
          DEADLINE_MS: "1200000"

      - if: ${{ steps.serves.outputs.outcome == 'ready' }}
        run: pnpm install --frozen-lockfile

      - if: ${{ steps.serves.outputs.outcome == 'ready' }}
        run: pnpm exec e2e-web install chromium --with-deps

      - name: Run the journeys tagged @sandbox that write nothing against production
        if: ${{ steps.serves.outputs.outcome == 'ready' }}
        run: |
          target="$RUNNER_TEMP/production.env"
          printf '%s\n' KUDOS_TARGET_KIND=rewrite "KUDOS_APP_URL=$APP_URL" "KUDOS_SLACK_SIGNING_SECRET=$SIGNING_SECRET" "KUDOS_SLACK_WORKSPACE=$WORKSPACE" "KUDOS_SLACK_APP_ID=$APP_ID" KUDOS_SIGN_IN=edge-header KUDOS_HOSTED=true "KUDOS_EDGE_SIGN_IN_URL=$SIGN_IN_URL" > "$target"
          E2E_TARGET="$target" pnpm exec e2e run --config e2e/e2e.config.ts --tag @sandbox --exclude-tag @writes
        env:
          APP_URL: ${{ vars.HEDGEHUG_PRODUCTION_URL }}
          SIGN_IN_URL: ${{ vars.HEDGEHUG_PRODUCTION_SIGN_IN_URL }}
          WORKSPACE: ${{ vars.HEDGEHUG_PRODUCTION_WORKSPACE }}
          APP_ID: ${{ vars.HEDGEHUG_PRODUCTION_APP_ID }}
          SIGNING_SECRET: ${{ secrets.HEDGEHUG_PRODUCTION_SIGNING_SECRET }}
