name: Spike measure

# Spike only, never merged: runs spike/self-host/measure.sh on an amd64 runner.
on:
  push:
    branches: [prototype/self-host-convex]
    paths: [spike/**, .github/workflows/spike-measure.yml]


permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: executor
            build_args: ""
            serve_knobs: ""
          - variant: outside
            build_args: --build-arg CARD_RENDER=outside
            serve_knobs: SCHEDULED_JOB_EXECUTION_PARALLELISM=2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - run: pnpm install --frozen-lockfile

      - run: uname -m; nproc; free -m; docker info --format '{{.CgroupDriver}} {{.CgroupVersion}}'

      - run: spike/self-host/measure.sh
        env:
          OUT: ${{ runner.temp }}/measure
          BUILD_ARGS: ${{ matrix.build_args }}
          SERVE_KNOBS: ${{ matrix.serve_knobs }}

      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: measure-amd64-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/measure
            !${{ runner.temp }}/measure/app-*.env
            !${{ runner.temp }}/measure/instance-secret
            !${{ runner.temp }}/measure/jwt-keys.json
          retention-days: 7
